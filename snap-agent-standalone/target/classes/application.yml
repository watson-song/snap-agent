server:
  port: ${PORT:8090}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  application:
    name: snap-agent-standalone
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/snap_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

snap-agent:
  enabled: true
  base-path: /snap-agent
  builtin-skills-dir: classpath:/docs/skills/

  # ---- LLM Configuration ----
  llm:
    api-type: ${LLM_API_TYPE:anthropic}
    base-url: ${LLM_BASE_URL:https://api.anthropic.com}
    api-key: ${LLM_API_KEY:}
    auth-token: ${LLM_AUTH_TOKEN:}
    model: ${LLM_MODEL:claude-sonnet-4-20250514}
    max-tokens: ${LLM_MAX_TOKENS:8192}
    timeout-seconds: ${LLM_TIMEOUT:120}
    streaming: true

  # ---- Agent ----
  agent:
    max-turns: 20
    task-timeout-minutes: 30
    max-concurrent-runs-per-user: 3
    max-runs-per-hour: 50
    max-result-rows: 1000
    task-store-max-size: 5000
    task-store-ttl-minutes: 1440

  # ---- JDBC Tools ----
  jdbc:
    enabled: ${JDBC_ENABLED:true}
    datasource-bean-name: dataSource

  # ---- Security (standalone mode) ----
  security:
    framework: spring
    audit-log: true
    required-permission: ""
    jwt:
      secret: ${JWT_SECRET:snap-agent-default-secret-change-me-in-production}
      user-claim: ${JWT_USER_CLAIM:sub}

  # ---- Standalone-specific ----
  standalone:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  # ---- Code Understanding ----
  code:
    enabled: ${CODE_ENABLED:false}
    project-root: ${PROJECT_ROOT:}

  # ---- Code Graph ----
  code-graph:
    enabled: ${CODE_GRAPH_ENABLED:false}

  # ---- Routing ----
  routing:
    mode: none

  # ---- Cost Tracking ----
  cost:
    enabled: true

  # ---- Anchor ----
  anchor:
    enabled: ${ANCHOR_ENABLED:false}

  # ---- Patrol ----
  patrol:
    enabled: ${PATROL_ENABLED:false}

  # ---- Alert ----
  alert:
    enabled: ${ALERT_ENABLED:false}

  # ---- Issue Closure ----
  issue-closure:
    enabled: false

  # ---- Fix ----
  fix:
    enabled: false

  # ---- Workflows ----
  workflows:
    enabled: ${WORKFLOWS_ENABLED:true}

# ---- Actuator ----
management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ---- Logging ----
logging:
  level:
    root: INFO
    cn.watsontech.snapagent: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
