<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapAgent Bridge</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h2>SnapAgent Bridge</h2>
        
        <!-- 当前宿主 -->
        <div class="host-info">
            <span class="label">Current Host:</span>
            <span id="currentHost">Loading...</span>
        </div>
        
        <!-- 主开关 -->
        <label class="toggle-row">
            <span>Master Switch</span>
            <input type="checkbox" id="masterToggle">
        </label>
        
        <!-- 服务开关 -->
        <div class="separator"></div>
        <div class="services">
            <label class="toggle-row">
                <span>Issue Tracker</span>
                <input type="checkbox" id="serviceIssueTracker">
            </label>
            <label class="toggle-row">
                <span>VCS</span>
                <input type="checkbox" id="serviceVcs">
            </label>
            <label class="toggle-row">
                <span>LLM</span>
                <input type="checkbox" id="serviceLlm">
            </label>
        </div>
        
        <!-- LLM 配置 -->
        <div class="separator"></div>
        <div class="llm-config" id="llmConfigSection" style="display: none;">
            <h3>LLM Configuration</h3>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="llmApiKey" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>Base URL</label>
                <input type="text" id="llmBaseUrl" placeholder="https://api.anthropic.com">
            </div>
            <div class="form-group">
                <label>Model</label>
                <select id="llmModel">
                    <option value="claude-sonnet-4-20250514">Claude Sonnet</option>
                    <option value="claude-opus-4-20250514">Claude Opus</option>
                    <option value="claude-haiku-4-5-20251001">Claude Haiku</option>
                </select>
            </div>
            <div class="form-group">
                <label>Max Tokens</label>
                <input type="number" id="llmMaxTokens" value="8192" min="100" max="32000">
            </div>
            <button id="saveLlmConfig" class="btn-primary">Save for this host</button>
        </div>
        
        <!-- 新增：本地代码目录授权 -->
        <div class="separator"></div>
        <div class="code-dir-section">
            <h3>Local Code Directory</h3>
            <div class="dir-status" id="dirStatus">
                <span class="label">Authorized Directory:</span>
                <span id="dirName" class="dir-name">None</span>
            </div>
            <button id="chooseDirBtn" class="btn-secondary">Choose Directory</button>
            <p class="hint">SnapAgent will be able to read files from this directory</p>
        </div>
        
        <!-- 状态 -->
        <div class="separator"></div>
        <div class="status" id="status">Loading...</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
